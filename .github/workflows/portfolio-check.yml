name: Public sample checks
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  sample:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Run sample tests
        run: node --test examples/crm-workflow/workflow.test.mjs
      - name: Run fictional-data demo
        run: node examples/crm-workflow/demo.mjs
